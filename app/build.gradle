plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.gson
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.4'
    modules = ['javafx.controls']
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg129024.Launcher'
}
